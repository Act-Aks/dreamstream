<svg xmlns="http://www.w3.org/2000/svg"
    width="108"
    height="108"
    viewBox="0 0 108 108">
    <defs>
        <linearGradient
            id="bg"
            x1="12"
            y1="12"
            x2="96"
            y2="96"
            gradientUnits="userSpaceOnUse">
            <stop
                offset="0%"
                stop-color="#050816" />
            <stop
                offset="100%"
                stop-color="#0C1430" />
        </linearGradient>

        <linearGradient
            id="cloud"
            x1="26"
            y1="24"
            x2="84"
            y2="82"
            gradientUnits="userSpaceOnUse">
            <stop
                offset="0%"
                stop-color="#B64BFF" />
            <stop
                offset="50%"
                stop-color="#5578FF" />
            <stop
                offset="100%"
                stop-color="#00E6FF" />
        </linearGradient>

        <linearGradient
            id="shine"
            x1="62"
            y1="22"
            x2="84"
            y2="44"
            gradientUnits="userSpaceOnUse">
            <stop
                offset="0%"
                stop-color="#CFFBFF" />
            <stop
                offset="100%"
                stop-color="#3DE7FF" />
        </linearGradient>

        <filter
            id="glow"
            x="-35%"
            y="-35%"
            width="170%"
            height="170%">
            <feGaussianBlur
                stdDeviation="2.1"
                result="b" />
            <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter
            id="shadow"
            x="-25%"
            y="-25%"
            width="150%"
            height="150%">
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="5.5"
                flood-color="#000000"
                flood-opacity="0.52" />
        </filter>
    </defs>

    <rect
        x="0"
        y="0"
        width="108"
        height="108"
        rx="24"
        fill="url(#bg)" />

    <path
        d="M30 66c-7.18 0-13-5.82-13-13 0-6.69 5.08-12.18 11.58-12.92C30.25 31.83 36.8 27 44.5 27c8.22 0 15.18 5.32 17.67 12.69C69.62 39.92 75 45.74 75 53c0 7.18-5.82 13-13 13H30z"
        fill="url(#cloud)"
        filter="url(#glow)" />

    <path
        d="M38 38c0-3.314 2.686-6 6-6h12c10.493 0 19 8.507 19 19s-8.507 19-19 19H42c-4.418 0-8-3.582-8-8V38zM48 38v24h7c5.523 0 10-4.477 10-10s-4.477-14-10-14h-7z"
        fill="#07101D"
        fill-opacity="0.34" />

    <path
        d="M56 42c0-2.209 1.791-4 4-4h4.2c2.209 0 4 1.791 4 4 0 1.46-.7 2.29-1.72 3.08L61.2 47c-.62.48-.8.78-.8 1.2 0 .73.58 1.3 1.3 1.3h7.6c2.209 0 4 1.791 4 4s-1.791 4-4 4h-2.5c-.9 0-1.5.58-1.5 1.35 0 .42.18.72.8 1.2l2.28 1.77c1.02.79 1.72 1.62 1.72 3.08 0 2.209-1.791 4-4 4h-4.2c-2.209 0-4-1.791-4-4 0-1.48.65-2.27 1.72-3.09l4.4-3.43c.58-.46.76-.74.76-1.18 0-.72-.57-1.3-1.3-1.3h-7.6c-2.209 0-4-1.791-4-4s1.791-4 4-4h2.5c.9 0 1.5-.58 1.5-1.35 0-.42-.18-.72-.8-1.2l-2.28-1.77C56.7 44.29 56 43.46 56 42z"
        fill="#EFFFFF"
        fill-opacity="0.95"
        filter="url(#shadow)" />

    <g filter="url(#shadow)">
        <rect
            x="66"
            y="24"
            width="16"
            height="16"
            rx="5.5"
            fill="url(#shine)"
            fill-opacity="0.88" />
        <path
            d="M71 29l6 3.8-6 3.8z"
            fill="#FFFFFF" />
    </g>
</svg>
